kind = "web"
previewPath = "/"
title = "TenderMind AI"
version = "1.0.0"
id = "artifacts/tendermind"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26140

[services.development]
run = "pnpm --filter @workspace/tendermind run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tendermind", "run", "build" ]
publicDir = "artifacts/tendermind/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26140"
BASE_PATH = "/"
